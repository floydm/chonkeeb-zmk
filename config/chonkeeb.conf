# ===== ENCODER CONFIGURATION =====
# Uncomment if you have EC11 encoders
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# CONFIG_EC11_MAP=y

# ===== DISPLAY CONFIGURATION =====
# Enable for Lily58 OLED (SSD1306)
# CONFIG_ZMK_DISPLAY=y
# CONFIG_SSD1306=y

# ===== POINTING DEVICE =====
CONFIG_ZMK_POINTING=y
# Optional pointing adjustments
CONFIG_ZMK_POINTING_DEFAULT_MOVE_VAL=600
CONFIG_ZMK_POINTING_DEFAULT_SCRL_VAL=10

# ===== POWER MANAGEMENT =====
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000  # 5 minutes
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ===== PERFORMANCE =====
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8

# ===== USB =====
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y