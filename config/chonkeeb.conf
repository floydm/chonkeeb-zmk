# ===== ENCODER CONFIGURATION =====
# Uncomment if you have EC11 encoders
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# CONFIG_EC11_MAP=y

# ===== DISPLAY CONFIGURATION =====
# Uncomment to enable OLED display
# CONFIG_ZMK_DISPLAY=y

# ===== POINTING DEVICE =====
CONFIG_ZMK_POINTING=y

# ===== POWER MANAGEMENT =====
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_PM_DEVICE=y
# CONFIG_PM_DEVICE_RUNTIME=y

# ===== PERFORMANCE =====
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8

# ===== USB =====
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y

# ===== NRF STORAGE =====
CONFIG_NRF_STORE_REBOOT_TYPE_GPREGRET=n