# ===== ENCODER CONFIGURATION =====
# Uncomment if you have EC11 encoders
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
# CONFIG_EC11_MAP=y

# ===== DISPLAY CONFIGURATION =====
# Enable for Lily58 OLED (SSD1306)
# CONFIG_ZMK_DISPLAY=y
# CONFIG_SSD1306=y
# CONFIG_DCACHE=n  # May be needed for some OLEDs

# ===== POINTING DEVICE =====
# If you're using a trackball/trackpoint
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_CLEANUP_PERIPHERAL=y  # Better power management

# ===== POWER MANAGEMENT =====
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000  # 5 minutes - better battery life
CONFIG_ZMK_PM_WAKEUP_ACTION=PRESS  # Wake on any keypress
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y  # Enable runtime power management

# ===== PERFORMANCE =====
CONFIG_ZMK_KEYBOARD_REPORT_BUFFER_SIZE=12  # If you have many layers
CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO=8

# ===== USB =====
# If using battery, this helps with power
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y
